{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">{{ title }}</h2>
  <a href="{{ url_for('reports.visit_log') }}" class="btn btn-outline-secondary">К журналу</a>
</div>

<div class="table-responsive">
  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>№</th>
        <th>Страница</th>
        <th>Количество посещений</th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        <td>{{ loop.index }}</td>
        <td>{{ row.path }}</td>
        <td>{{ row.visits_count }}</td>
      </tr>
      {% else %}
      <tr>
        <td colspan="3" class="text-center">Записей пока нет.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<a href="{{ url_for('reports.pages_report_csv') }}" class="btn btn-primary">Экспорт в CSV</a>
{% endblock %}
