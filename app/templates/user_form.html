{% extends "base.html" %}

{% block content %}
<h2>Редактировать пользователя</h2>

<form method="post" class="row g-3">
  <div class="col-md-6">
    <label for="login" class="form-label">Логин</label>
    <input id="login" type="text" name="login" class="form-control" value="{{ user.login }}" required>
  </div>
  <div class="col-md-6">
    <label for="role_id" class="form-label">Роль</label>
    <select id="role_id" name="role_id" class="form-select">
      <option value="">Без роли</option>
      {% for role in roles %}
      <option value="{{ role.id }}" {% if user.role_id == role.id %}selected{% endif %}>{{ role.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label for="last_name" class="form-label">Фамилия</label>
    <input id="last_name" type="text" name="last_name" class="form-control" value="{{ user.last_name or '' }}">
  </div>
  <div class="col-md-4">
    <label for="first_name" class="form-label">Имя</label>
    <input id="first_name" type="text" name="first_name" class="form-control" value="{{ user.first_name }}" required>
  </div>
  <div class="col-md-4">
    <label for="middle_name" class="form-label">Отчество</label>
    <input id="middle_name" type="text" name="middle_name" class="form-control" value="{{ user.middle_name }}" required>
  </div>
  <div class="col-12 d-flex gap-2">
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('main.user_detail', user_id=user.id) }}" class="btn btn-outline-secondary">Отмена</a>
  </div>
</form>
{% endblock %}
