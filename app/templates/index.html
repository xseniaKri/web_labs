{% extends "base.html" %}

{% block content %}

<h2>Главная страница</h2>

<p>
В системе зарегистрировано учетных записей:
<b>{{ users_count }}</b>
</p>

{% if current_user.is_authenticated %}

<p>
Вы вошли как:
<b>{{ current_user.login }}</b>
</p>

{% else %}

<p>
Вы не авторизованы
</p>

{% endif %}

{% endblock %}
